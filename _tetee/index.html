<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tétée</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com/firebasejs/10.12.2/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google.com; connect-src 'self' https://firestore.googleapis.com https://www.gstatic.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FAF7F2">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#FAF7F2;--card:#FFFFFF;--soft:#F0E8DC;--fg:#3D2B2B;--muted:#8C7B76;--line:#E9DFD3;
  --accent:#C97B6B;--accent-fg:#fff;--g:#C97B6B;--d:#7A9E8E;--warn:#C9A96E;--sh:0 2px 10px rgba(61,43,43,.08);
}
:root[data-theme="night"]{
  --bg:#000;--card:#110605;--soft:#1A0A08;--fg:#D2715E;--muted:#8A4A3E;--line:#2A110E;
  --accent:#7E2A1F;--accent-fg:#F3B4A4;--g:#6A2118;--d:#4D3013;--warn:#B07A3A;--sh:none;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
:root{color-scheme:light} :root[data-theme="night"]{color-scheme:dark}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);
  display:flex;flex-direction:column;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;user-select:text}

header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
header h1{font-size:20px;font-weight:700;flex:1}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.chip.ok{color:var(--d)} .chip.err{color:var(--accent)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--soft);font-size:20px;display:grid;place-items:center}

main{flex:1;overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--accent);font-weight:600}

/* Accueil */
.home{display:flex;flex-direction:column;gap:12px;flex:1}
.onehand .home{justify-content:flex-end}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.since{text-align:center}
.lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.sub{font-size:14px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border-radius:18px;padding:16px;background:var(--card);box-shadow:var(--sh);font-size:18px;font-weight:600;min-height:64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn small{font-size:13px;font-weight:400;color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary small{color:inherit;opacity:.8}
.side{min-height:130px;font-size:40px;font-weight:800;color:#fff}
.side small{color:#fff;opacity:.85;font-size:14px}
.side.G{background:var(--g)} .side.D{background:var(--d)}
:root[data-theme="night"] .side.G,:root[data-theme="night"] .side.G small{color:#F0A08E}
:root[data-theme="night"] .side.D,:root[data-theme="night"] .side.D small{color:#E9B27A}
:root[data-theme="night"] .card,:root[data-theme="night"] .btn:not(.side):not(.primary):not(.huge){border:1px solid var(--line)}
:root[data-theme="night"] .badge{background:rgba(0,0,0,.35);color:#F3B4A4}
.side.dim{opacity:.45}
.side.on{outline:4px solid var(--fg);outline-offset:-4px}
.side .t{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:8px;right:10px;font-size:11px;font-weight:600;background:rgba(0,0,0,.18);color:#fff;padding:2px 8px;border-radius:99px}
.onehand main .side{min-height:170px}
.onehand main .btn{min-height:80px}
.link{color:var(--muted);font-size:14px;padding:8px;text-decoration:underline}
.paused{color:var(--warn)}

/* Historique */
.day{font-size:13px;color:var(--muted);font-weight:600;margin:16px 4px 6px;text-transform:capitalize}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;background:var(--card);border-radius:14px;margin-bottom:6px;box-shadow:var(--sh)}
.row .ic{font-size:22px;width:30px;text-align:center}
.row .tx{flex:1;min-width:0}
.row .tx div:first-child{font-weight:600}
.row .tx div+div{font-size:13px;color:var(--muted)}
.row .tm{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.row .tm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.adds{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.adds .btn{min-height:48px;font-size:14px}

/* Stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--soft);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi .kinds{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin-top:4px;font-size:13px}
.kpi .kinds span{font-size:13px;color:var(--fg)}
.kpi .kinds b{display:inline;font-size:15px}
h2{font-size:16px;margin:18px 4px 8px}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0 4px;background:var(--soft)}
.split i{display:block}
.bars .b{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bars .b .track{background:var(--soft);border-radius:6px;height:26px;position:relative;overflow:hidden}
.bars .b .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.8;border-radius:6px}
.bars .b .val{position:absolute;left:8px;top:4px;font-size:12px;font-weight:600;white-space:nowrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--soft);font-size:14px;min-width:30%}
.seg input{display:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-fg)}

/* Réglages */
.set{display:flex;flex-direction:column;gap:10px}
.set p{font-size:13px;color:var(--muted)}
#pauseSeg label,#guardSeg label,.fld .seg label{min-width:0;padding:10px 4px;font-size:13px}
input[type=checkbox]{accent-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.code{font-family:ui-monospace,monospace;font-size:18px;letter-spacing:.1em}
.toggle{display:flex;justify-content:space-between;align-items:center}
.toggle input{width:auto;transform:scale(1.4)}

dialog{border:0;border-radius:20px;background:var(--card);color:var(--fg);padding:18px;width:min(420px,calc(100% - 24px));margin:auto auto 12px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{display:flex;flex-direction:column;gap:12px}
dialog h3{font-size:20px}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
dialog menu{display:flex;gap:10px;margin-top:4px}
dialog menu .btn{min-height:52px;font-size:16px;padding:10px 16px;flex:1}
.mlv{display:flex!important;flex-direction:row!important;align-items:baseline;justify-content:center;gap:4px}
.mlv input{width:140px;font-size:44px;font-weight:700;text-align:center;padding:4px 0;background:none;border:0;border-bottom:2px solid var(--line);border-radius:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.mlv input::-webkit-inner-spin-button,.mlv input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#mlr{width:100%;padding:0;height:36px;background:none;border:0;accent-color:var(--accent)}
.mlv span{font-size:14px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.quick .btn{min-height:44px;font-size:15px;padding:6px}
.danger{color:var(--accent)!important}
/* accueil : tuiles et frise de la journée */
.spacer{flex:1}
a.btn{text-decoration:none;color:inherit}
.set a.link{padding:0}
.since.tap{width:100%;cursor:pointer;color:inherit}
.since.tap:active{transform:scale(.99)}
.since .next{margin-top:8px;font-size:14px;font-weight:600;color:var(--d)}
.since .next.late{color:var(--accent)}
.mini-tiles{gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.tile .lbl{font-size:11px}
.tile b{font-size:20px;font-variant-numeric:tabular-nums}
.tile small{font-size:12px;color:var(--muted)}
.today{padding:12px 14px}
.today-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.today-h .lbl{font-size:11px}
.today-h b{color:var(--fg)}
:root{--tl-z:#4B5BA6;--tl-t:#7B4FA0;--tl-bg:#E6D9CA;--tl-grid:rgba(61,43,43,.14);--tl-g:#B9442F;--tl-d:#2F7A5C;--tl-b:#D99A1E;--tl-c:#4A3532;--tl-now:#3D2B2B}
:root[data-theme="night"]{--tl-z:#3B3F78;--tl-t:#C79AE0;--tl-bg:#1F0D0A;--tl-grid:rgba(210,113,94,.16);--tl-g:#D9563F;--tl-d:#E0A040;--tl-b:#F2D07A;--tl-c:#B07A6E;--tl-now:#F0A08E}
.tl{position:relative;height:38px;margin-top:10px;border-radius:8px;background:var(--tl-bg);overflow:hidden;
  background-image:linear-gradient(90deg,transparent calc(25% - .5px),var(--tl-grid) calc(25% - .5px),var(--tl-grid) calc(25% + .5px),transparent calc(25% + .5px),
    transparent calc(50% - .5px),var(--tl-grid) calc(50% - .5px),var(--tl-grid) calc(50% + .5px),transparent calc(50% + .5px),
    transparent calc(75% - .5px),var(--tl-grid) calc(75% - .5px),var(--tl-grid) calc(75% + .5px),transparent calc(75% + .5px))}
.tl i{position:absolute}
.tl .tl-s{top:5px;height:16px;border-radius:3px;min-width:4px}
.tl .tl-b{top:8px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;box-shadow:0 0 0 2px var(--tl-bg)}
.tl .tl-c{top:26px;width:8px;height:8px;margin-left:-4px;border-radius:50%}
.tl .tl-now{top:0;bottom:0;width:2px;margin-left:-1px;background:var(--tl-now)}
.tl-s.G{background:var(--tl-g)} .tl-s.D{background:var(--tl-d)}
.tl-b{background:var(--tl-b)}
.tl-c{background:var(--tl-c)}
.tl-h{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.tl-k{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fg);margin-top:8px}
.tl-k span{display:flex;align-items:center;gap:5px}
.tl-k i{display:inline-block;width:12px;height:12px;border-radius:3px}
.tl-k .tl-b,.tl-k .tl-c{border-radius:50%}
.tl .tl-c.explosion{width:12px;height:12px;margin-left:-6px;top:24px;background:var(--tl-g);box-shadow:0 0 0 2px var(--tl-bg)}
.couches .btn{min-height:84px;font-size:17px;gap:2px}
.couches .btn small{font-size:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 .btn{font-size:14px;gap:4px;padding:10px 4px}
.onehand .grid4 .btn{min-height:78px}
.grid4 .btn.sleeping{background:var(--tl-z);color:#fff}
.sleepbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--tl-z);color:#fff;border-radius:16px;padding:12px 16px}
.sleepbar .i{width:28px;height:28px}
.sleepbar span{flex:1;display:flex;flex-direction:column;font-size:14px}
.sleepbar b{font-size:24px;font-variant-numeric:tabular-nums}
.sleepbar small{opacity:.8;font-size:12px}
.sleepbar em{font-style:normal;font-weight:700;background:rgba(255,255,255,.2);padding:10px 14px;border-radius:12px}
.tl .tl-z{top:0;bottom:0;background:var(--tl-z);opacity:.28}
.tl-k .tl-z{background:var(--tl-z);opacity:.5}
.growth{width:100%;height:auto;margin-top:10px}
.growth .ax{font-size:10px;fill:var(--muted)}
.pump{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px}
.pump .tag{height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff}
.pump .tag.G{background:var(--g)} .pump .tag.D{background:var(--d)}
.rng{width:100%;padding:0;height:32px;background:none;border:0;accent-color:var(--accent)}
.pump .mlv input{width:110px;font-size:32px}
.tl .tl-t{top:8px;width:10px;height:10px;margin-left:-5px;border-radius:2px;transform:rotate(45deg);box-shadow:0 0 0 2px var(--tl-bg)}
.tl-t{background:var(--tl-t)}
.tl-k .tl-t{border-radius:2px;transform:rotate(45deg) scale(.85)}
.ck.explosion{color:var(--accent)}
/* icônes */
.i{width:1.25em;height:1.25em;flex:none;vertical-align:-.25em}
header h1{display:flex;align-items:center;gap:8px}
.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-fg)}
.logo .i{width:20px;height:20px}
.iconbtn .i{width:22px;height:22px}
nav button b{height:24px;display:grid;place-items:center} nav button b .i{width:24px;height:24px}
.chip{display:inline-flex;align-items:center;gap:5px} .chip .i{width:15px;height:15px}
.btn .i{width:26px;height:26px}
.btn.row-btn{flex-direction:row;gap:10px}
dialog h3{display:flex;align-items:center;gap:10px} dialog h3 .i{color:var(--accent)}
.row .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent)}
.row .ic .i{width:22px;height:22px}
/* tétée en cours : gros bouton pause, petits boutons de sein */
.side.mini{min-height:96px;font-size:16px;gap:0}
.onehand .side.mini{min-height:104px}
.side.mini .sl{font-size:28px;font-weight:800;line-height:1}
.side.mini .t{font-size:18px}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 6px);z-index:5;display:flex;align-items:center;gap:12px;
  background:var(--fg);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 6px 24px rgba(0,0,0,.25);overflow:hidden;font-size:15px}
#toast[hidden]{display:none}
#toastMsg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{padding:4px 4px 4px 14px;min-height:0;max-height:46px;font-size:14px;top:calc(env(safe-area-inset-top) + 3px)!important}
#toastUndo{padding:8px 14px!important;font-size:15px!important;flex:none}
#toastUndo{background:var(--accent);color:var(--accent-fg);font-weight:700;border-radius:12px;padding:12px 18px;font-size:16px}
#toastBar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent);animation:shrink var(--delay,10s) linear forwards}
#toastUndo[hidden]{display:none}
.dlgbar{display:block;height:3px;background:var(--accent);border-radius:2px;animation:shrink var(--delay,10s) linear forwards}
.armed{outline:4px dashed var(--fg)!important;outline-offset:-4px;opacity:1!important}
.link.armed{outline-offset:2px;border-radius:8px}
select{appearance:auto}
@keyframes shrink{from{width:100%}to{width:0}}
:root[data-theme="night"] #toast{background:#2A1310;color:#E9A595}
.btn.huge{min-height:150px;font-size:28px;font-weight:700;gap:6px;background:var(--fg);color:var(--bg)}
.btn.huge small{color:inherit;opacity:.7;font-size:14px}
.btn.huge .i{width:44px;height:44px}
.onehand .btn.huge{min-height:190px}
.btn.huge.resume.G{background:var(--g);color:#fff} .btn.huge.resume.D{background:var(--d);color:#fff}
:root[data-theme="night"] .btn.huge{background:#1E0B09;color:#E58C78;border:1px solid #3A1712}
:root[data-theme="night"] .btn.huge.resume{color:#F0B3A3}
.adj{display:grid;grid-template-columns:44px 64px 1fr;gap:8px;align-items:center}
.adj b.side{min-height:0;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.adj .t{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.adj .quick{grid-template-columns:repeat(4,1fr)}
.step{display:flex;gap:6px;align-items:center}
.step .btn{min-height:44px;width:44px;padding:0;font-size:22px;flex:none}
.step input{text-align:center;font-size:18px}
/* ---------- tout tient en hauteur (accueil, stats) ---------- */
main.v-home,main.v-stats{overflow:hidden}
.home{gap:clamp(6px,1.3vh,12px);min-height:0}
.home .since{padding:clamp(8px,1.6vh,16px)}
.home .big{font-size:clamp(30px,5.4vh,44px)}
.home .spacer{flex:.001 1 0;min-height:0}  /* ne prend que la place laissée quand les boutons sont à leur maximum */
body:not(.onehand) .home .spacer{order:99}
.home.idle .gd{flex:3 1 0;min-height:76px;max-height:280px}
.home.idle .gd .side{min-height:0!important;height:100%}
.home .grid4{flex:1 1 0;min-height:56px;max-height:110px}
.home .grid4 .btn{min-height:0!important;height:100%;padding:6px 4px}
.home .link{padding:4px;flex:none}
.home.feed .minis .side.mini{min-height:0!important;height:clamp(72px,12vh,104px)}
.home.feed .huge{flex:1 1 0;min-height:92px!important;max-height:240px}
.home.feed .feedbar .btn{min-height:clamp(54px,8vh,80px)!important}
.home .sleepbar{flex:none;padding:8px 14px}
.home .sleepbar b{font-size:20px}
.home > *{flex-shrink:0}
.home > .spacer,.home.idle > .gd,.home.idle > .grid4,.home.feed > .huge{flex-shrink:1}
/* les détails se masquent selon la place réellement disponible dans la page (et non la taille de l'écran) */
main.v-home{container-type:size}
@container (max-height:640px){
  .tl-k,.tile small{display:none}
  .tile{padding:8px 12px} .today{padding:10px 12px}
  .home .since .sub{font-size:13px} .since .next{margin-top:4px}
}
@container (max-height:540px){
  .mini-tiles,.tl-h{display:none}
  .tl{margin-top:6px;height:30px}
  .home .lbl{font-size:11px}
}
@container (max-height:430px){ .home .today-h span:last-child{display:none} }
@media (max-height:580px){
  header{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
  nav button{padding:6px 0 8px}
}
/* stats en onglets */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:2px 0 10px;background:var(--soft);padding:4px;border-radius:14px;flex:none}
.tabs button{padding:9px 2px;border-radius:10px;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--fg);font-weight:700;box-shadow:var(--sh)}
.stats-pane{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.v-stats .kpis{grid-template-columns:repeat(3,1fr);gap:6px}
.v-stats .kpi{padding:8px}
.v-stats .kpi b{font-size:18px}
.v-stats .kpi span{font-size:11px}
.v-stats .kpi:has(.kinds){grid-column:1/-1}
.v-stats .kinds{grid-template-columns:repeat(4,auto)!important;justify-content:space-between}
.v-stats .card{padding:12px}
.v-stats .bars .b{margin:3px 0} .v-stats .bars .b .track{height:24px}
@media (max-height:660px){ .v-stats .bars .b{margin:2px 0} .v-stats .bars .b .track{height:20px} .v-stats .bars .b .val{top:2px} }
@media (max-height:700px){ .v-stats .compact .split,.v-stats .compact .split + .sub,.v-stats .compact .kpi:nth-child(n+7){display:none} }
/* fenêtre de modification */
dialog h3 .trash{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);padding:8px 10px;border-radius:10px}
dialog h3 .trash .i{width:18px;height:18px;color:var(--accent)}
.sides{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:40px 1fr 48px 92px 48px;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:8px}
.srow .tag{height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:#fff}
.srow .tag.G{background:var(--g)} .srow .tag.D{background:var(--d)}
.srow .sname{font-size:15px;color:var(--fg)}
.srow .btn{min-height:44px!important;height:44px;padding:0;font-size:24px;border-radius:12px}
.srow .val{display:flex!important;flex-direction:row!important;align-items:baseline;justify-content:center;gap:3px;color:var(--muted)}
.srow .val input{width:52px;padding:4px 0;font-size:24px;font-weight:700;text-align:center;background:none;border:0;border-bottom:2px solid var(--line);border-radius:0;-moz-appearance:textfield}
.srow .val input::-webkit-inner-spin-button,.srow .val input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.endhint{font-size:14px;color:var(--muted);text-align:center}
.endhint b{color:var(--fg)}
@media (max-width:370px){ .srow{grid-template-columns:36px 1fr 44px 80px 44px;gap:6px} .srow .sname{font-size:13px} }
/* heure + jour */
.when{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.when input[type=time]{font-size:22px;font-weight:700;text-align:center;padding:8px}
.when select{font-size:15px;padding:8px}
/* page de déménagement (ancienne adresse) */
.move{display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center;max-width:420px;margin:auto;padding:20px 4px}
.move .big-logo{width:64px;height:64px;border-radius:20px;margin:0 auto}
.move .big-logo .i{width:36px;height:36px}
.move h2{font-size:24px;margin:0}
.move .code{font-size:17px;font-weight:700;color:var(--accent);word-break:break-all}
.move .btn{min-height:60px}
/* vitamine D : bien visible tant qu'elle n'est pas donnée, discrète une fois faite */
.vitd{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:14px;text-align:left;flex:none;border:2px solid #F0A030;background:#FFE7C2;color:#7A3F00}
.vitd .i{width:22px;height:22px}
.vitd span{font-weight:700;font-size:15px}
.vitd small{margin-left:auto;font-size:13px}
.vitd .tag-todo{margin-left:auto;font-size:13px;letter-spacing:.06em;padding:5px 10px;border-radius:99px}
.vitd.todo{background:#FFE7C2;color:#7A3F00;border-color:#F0A030}
.vitd.todo .tag-todo{background:#E8890C;color:#fff}
.vitd.late{background:#FFD9D2;color:#8A1C0B;border-color:#D9442C}
.vitd.late .tag-todo{background:#C8321A;color:#fff}
.vitd.ok{background:var(--soft);color:var(--muted)} .vitd.ok .i{color:#3E8A62}
:root[data-theme="night"] .vitd.todo{background:#2E1C06;color:#F2B860;border-color:#B8701A}
:root[data-theme="night"] .vitd.todo .tag-todo{background:#B8701A;color:#1A0E02}
:root[data-theme="night"] .vitd.late{background:#3A0D07;color:#FF8C78;border-color:#C8321A}
:root[data-theme="night"] .vitd.late .tag-todo{background:#C8321A;color:#FFE4DE}
:root[data-theme="night"] .vitd.ok{border-color:var(--line)} :root[data-theme="night"] .vitd.ok .i{color:#6FB892}
/* historique : sein + biberon d'un même repas, rattachés */
.row.grp-top{margin-bottom:0;border-bottom-left-radius:4px;border-bottom-right-radius:4px}
.row.grp-bot{margin-top:2px;border-top-left-radius:4px;border-top-right-radius:4px;padding-left:24px}
.row.grp-bot .ic{width:32px;height:32px}
</style>
</head>
<body>
<header>
  <h1><span class="logo" data-i="feed"></span>Tétée</h1>
  <span id="sync" class="chip">local</span>
  <button class="iconbtn" data-act="night" title="Mode nuit" aria-label="Mode nuit"></button>
</header>
<main id="main"></main>
<nav>
  <button data-view="home"><b data-i="timer"></b>Accueil</button>
  <button data-view="history"><b data-i="list"></b>Historique</button>
  <button data-view="stats"><b data-i="chart"></b>Stats</button>
  <button data-view="settings"><b data-i="sliders"></b>Réglages</button>
</nav>
<div id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastUndo" type="button">Annuler</button><i id="toastBar"></i></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script type="module" src="app.js"></script>
</body>
</html>
